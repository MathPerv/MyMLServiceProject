name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: behavior}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postges"
          --health-interval 5s --health-timeout 3s --health-retries 10
      
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/behavior

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/behavior-service/sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOCKEN}}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max