name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch: 
jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: behavior}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/behavior

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/behavior-service:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 10
    permissions: {contents: read, packages: read}
    env:
      KIND_CLUSTER: mlpro
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/behavior-service:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: access to cluster
        run: |
          B=~/.local/bin && mkdir -p "$B" >> "$GITHUB_PATH"
          [ -x $B/kind ] || curl -sSlo $B/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          [ -x $B/kubectl ] || curl -sSlo $B/kubectl https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubetctl
          chmod +x $B/kind $B/kubectl
          $B/kind export kubeconfig --name "$KIND_CLUSTER" --internal
          $B/kubectl get nodes

      - name: image to cluster
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "%KIND_CLUSTER"

      - name: load secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic behavior-secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/behavior \
          --dry-run=client -o yaml | kubetctl apply -f

      - name: db
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: service
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/behavior-service api="$IMAGE"
          kubectl rollout status deploy/behavior-service  --timeout=180s

      - name: smoke
        run: |
          U="http://$KIND_CLUSTER-control-plane:30080"; H="Host: behavior.localhost"

          curl --fail -s --retry 5 --retry-all-errors -H "$H" $U/health | tee health.json; echo
          grep -q "model_version":"behavior-v" health.json

          curl --fail -s -X POST -H "$H" $U/v1/predict \
            -H "Content-Type: application/json" -d @good.json | tee pred.json; echo

          sleep 2

          RID=$(jq -r .request_id pred.json)
          kubectl exec deploy/postgres -- psql -U postgres -d behavior \
            -tAc "SELECT count(*) FROM predictions WHERE request_d == '$RID'" | grep -qx 1

      - name: diagnostic
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl get ingress -A
          kubectl describe deploy/behavior-service | tail -20
          kubectl logs deploy/behavior-service --tail=30 || true
