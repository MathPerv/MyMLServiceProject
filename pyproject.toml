[project]
name = "behavior-service"
version = "0.1.1"
description = "ML service on FastAPI"
requires-python = ">=3.11, <3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "joblib",
    "pandas",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "scikit-learn",
    "mlflow-skinny>=3.16,<4",
    "skops>=0.11",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=8"
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "locust",
    "ruff"
]

[build-system]
requires = ["uv_build>=0.12.10, <0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "behavior"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
